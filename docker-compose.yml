# Local infrastructure. `docker compose up -d` then `pnpm dev`.
# Add `--profile app` to also run the web and worker images (built from ./Dockerfile).
name: sold

x-postgres-env: &postgres-env
  POSTGRES_USER: sold
  POSTGRES_PASSWORD: sold
  POSTGRES_DB: sold

services:
  postgres:
    image: postgres:16
    environment: *postgres-env
    ports: ['127.0.0.1:5432:5432']
    stop_grace_period: 30s
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250
      - -c
      - max_connections=200
      - -c
      - idle_in_transaction_session_timeout=15000
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sold -d sold']
      interval: 5s
      timeout: 3s
      retries: 20

  # Transaction-pooling PgBouncer in front of Postgres, as deployed. The app uses this (DATABASE_URL);
  # migrations and the job queue use Postgres directly (DATABASE_MIGRATION_URL).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_USER: sold
      DB_PASSWORD: sold
      DB_NAME: sold
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: '20'
      MAX_CLIENT_CONN: '2000'
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports: ['127.0.0.1:6432:5432']

  # noeviction is wrong for a cache and volatile-lru is right for this mix: cache entries carry TTLs and may be
  # evicted; counters (hot-SKU stock, rate limits) have no TTL, so they are never evicted.
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'volatile-lru',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment: { MINIO_ROOT_USER: sold, MINIO_ROOT_PASSWORD: soldsoldsold }
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/metrics-token:/etc/prometheus/metrics-token:ro
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:9090:9090']

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GRAFANA_DB_PASSWORD: sold_grafana
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3030:3000']
    depends_on: [prometheus]

  # ---- application images (profile: app) ------------------------------------
  web:
    profiles: [app]
    build: { context: ., target: web }
    environment: &app-env
      SOLD_ENVIRONMENT: local
      DATABASE_URL: postgres://sold:sold@pgbouncer:5432/sold
      DATABASE_MIGRATION_URL: postgres://sold:sold@postgres:5432/sold
      DATABASE_POOLER: pgbouncer
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: local-metrics-token-1234
    ports: ['127.0.0.1:3000:3000']
    # Longer than SOLD_DRAIN_SECONDS (10 s) plus in-flight request time: the app drains before it exits.
    stop_grace_period: 30s
    depends_on:
      pgbouncer: { condition: service_started }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., target: worker }
    environment: *app-env
    ports: ['127.0.0.1:3001:3001']
    # Worker drain waits up to 30 s for in-flight jobs.
    stop_grace_period: 45s
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  minio-data:
