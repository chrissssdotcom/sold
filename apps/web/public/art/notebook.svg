<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-hidden="true">

  <defs>
    <radialGradient id="bg-notebook" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#f2eadf"/><stop offset="1" stop-color="#dccbb4"/></radialGradient>
    <linearGradient id="floor-notebook" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".0"/></linearGradient>
    <filter id="blur-notebook" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft-notebook" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
<rect width="800" height="1000" fill="url(#bg-notebook)"/>
<rect y="800" width="800" height="200" fill="url(#floor-notebook)"/>
<circle cx="640" cy="200" r="190" fill="#fff" opacity=".28" filter="url(#soft-notebook)"/>

      <g transform="rotate(-7 400 620)">
      <ellipse cx="410" cy="800" rx="230" ry="27.599999999999998" fill="#3b2a1e" opacity=".28" filter="url(#blur-notebook)"/>
      <defs><linearGradient id="cover-notebook" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f4a3d"/><stop offset="1" stop-color="#203529"/></linearGradient></defs>
      <rect x="220" y="380" width="360" height="430" rx="20" fill="#f5efe3"/>
      <rect x="232" y="392" width="360" height="430" rx="20" fill="#ebe3d3"/>
      <rect x="210" y="368" width="370" height="440" rx="20" fill="url(#cover-notebook)"/>
      <rect x="210" y="368" width="34" height="440" rx="16" fill="#000" opacity=".22"/>
      <rect x="540" y="368" width="14" height="440" fill="#c8683c"/>
      <rect x="300" y="500" width="190" height="130" rx="4" fill="none" stroke="#d7c79c" stroke-width="3"/>
      <text x="395" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#d7c79c" letter-spacing="8">NOTES</text>
      <line x1="330" y1="590" x2="460" y2="590" stroke="#d7c79c" stroke-width="2"/></g>
</svg>