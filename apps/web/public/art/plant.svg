    <linearGradient id="floor-plant" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".0"/></linearGradient>
    <filter id="blur-plant" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft-plant" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
<rect width="800" height="1000" fill="url(#bg-plant)"/>
<rect y="800" width="800" height="200" fill="url(#floor-plant)"/>
<circle cx="640" cy="200" r="190" fill="#fff" opacity=".28" filter="url(#soft-plant)"/>

      <ellipse cx="400" cy="812" rx="170" ry="20.4" fill="#3b2a1e" opacity=".28" filter="url(#blur-plant)"/>
      <defs><linearGradient id="clay-plant" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d98458"/><stop offset="1" stop-color="#b15a33"/></linearGradient><linearGradient id="leaf-plant" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#2f5a35"/></linearGradient></defs>
      <g fill="url(#leaf-plant)">
        <ellipse cx="400" cy="340" rx="44" ry="150" />
