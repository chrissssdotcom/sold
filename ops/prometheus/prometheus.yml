global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: sold-web
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs: [{ targets: ['host.docker.internal:3000'] }]
  - job_name: sold-worker
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics-token }
    static_configs: [{ targets: ['host.docker.internal:3001'] }]
