# Release pipeline: BUILD ONCE, sign, promote the same digest.
#
#   push to main (code)             build web/worker(/migrate) -> cosign keyless sign -> SBOM attest -> push to ACR
#                                   -> stamp environments/dev/release.json -> deploy dev
#   workflow_dispatch promote_to    open a promotion PR that copies release.json dev->stage or stage->prod
#                                   (`sold promote`: same digest, nothing is rebuilt)
#   push to main (release.json)     deploy the environment whose release.json changed: verify the signature,
#                                   run migrations, canary via Container Apps revisions + traffic splitting
#                                   (10% -> 50% -> 100%) with SLO checks and AUTO-ROLLBACK, all in `sold release:deploy`
#
# Production: the `prod` job is bound to the GitHub environment `prod` (required reviewers, deployment
# branches: main) and uses a SEPARATE Azure identity whose federated credential only matches that environment.
# The CLI refuses prod unless the approved job set SOLD_DEPLOY_APPROVED, and enforces the deploy freeze
# (repository variable SOLD_DEPLOY_FREEZE=true, or environments/prod/freeze.json windows; emergency override:
# repository variable PROD_FREEZE_OVERRIDE holding a written reason, which is logged).
#
# Repository variables: AZURE_TENANT_ID, ACR_NAME; non-prod: AZURE_SUBSCRIPTION_ID_NONPROD, AZURE_CLIENT_ID_NONPROD.
# Environment `prod` variables: AZURE_SUBSCRIPTION_ID_PROD, AZURE_CLIENT_ID_PROD.
# Secrets: CLOUDFLARE_API_TOKEN, NEXT_SERVER_ACTIONS_ENCRYPTION_KEY (BuildKit secret), optional PROMOTION_TOKEN
# (a token that lets the promotion PR trigger CI; PRs opened with GITHUB_TOKEN do not).
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/env-*.yml'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      promote_to:
        description: Open a promotion PR into this environment (dev->stage or stage->prod)
        required: true
        default: none
        type: choice
        options: [none, stage, prod]

# One release at a time; a deploy in flight is never cancelled.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  detect:
    name: What changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      stage: ${{ steps.diff.outputs.stage }}
      prod: ${{ steps.diff.outputs.prod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Diff the push
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "${BEFORE}" "${SHA}")"
          fi
          echo "${changed}"
          flag() { if grep -q "$1" <<< "${changed}"; then echo true; else echo false; fi; }
          # Anything that is not docs, environment records or CI-only files changes the artifact.
          if grep -Ev '^(docs/|environments/|\.github/|.*\.md$)' <<< "${changed}" | grep -q .; then build=true; else build=false; fi
          {
            echo "build=${build}"
            echo "stage=$(flag '^environments/stage/release.json$')"
            echo "prod=$(flag '^environments/prod/release.json$')"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build once, sign, attest
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: read
      id-token: write # Azure OIDC and Sigstore keyless signing
      attestations: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      migrate_digest: ${{ steps.migrate.outputs.digest }}
      build_number: ${{ steps.ids.outputs.build_number }}
      version: ${{ steps.ids.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Azure login (OIDC, non-production identity, may push to the registry)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Registry login
        run: az acr login --name "$ACR_NAME"
      - name: Compute the version identifier
        id: ids
        run: |
          set -euo pipefail
          customer="$(pnpm --silent sold env:id --env dev | tail -n1)"
          customer="${customer%%-*}"
          build_number="$(( $(jq '.instanceBuild' environments/dev/release.json) + 1 ))"
          base_version="$(tr -d '[:space:]' < .sold/base-version)"
          {
            echo "build_number=${build_number}"
            echo "version=${base_version}+${customer}.${build_number}"
            echo "registry=${ACR_NAME}.azurecr.io"
            if grep -qE '^FROM .* AS migrate' Dockerfile; then echo "has_migrate=true"; else echo "has_migrate=false"; fi
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push web
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.ids.outputs.registry }}/sold/web:sha-${{ github.sha }}
          build-args: |
            SOLD_BUILD_ID=${{ github.sha }}
            SOLD_VERSION=${{ steps.ids.outputs.version }}
          secrets: |
            next_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,scope=release-web,mode=max
      - name: Build and push worker
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.ids.outputs.registry }}/sold/worker:sha-${{ github.sha }}
          build-args: |
            SOLD_BUILD_ID=${{ github.sha }}
            SOLD_VERSION=${{ steps.ids.outputs.version }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,scope=release-worker,mode=max
      # PENDING(phase-0): the Dockerfile needs a `migrate` target (migrator bundled like the worker bundle).
      # Until it exists this step is skipped and the migrate job falls back to the web image, which cannot migrate.
      - name: Build and push migrate
        id: migrate
        if: steps.ids.outputs.has_migrate == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.ids.outputs.registry }}/sold/migrate:sha-${{ github.sha }}
          build-args: |
            SOLD_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=release-migrate
          cache-to: type=gha,scope=release-migrate,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the images (Sigstore keyless, bound to this workflow's identity)
        env:
          REGISTRY: ${{ steps.ids.outputs.registry }}
          WEB: ${{ steps.web.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          MIGRATE: ${{ steps.migrate.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/sold/web@${WEB}"
          cosign sign --yes "${REGISTRY}/sold/worker@${WORKER}"
          if [ -n "${MIGRATE}" ]; then cosign sign --yes "${REGISTRY}/sold/migrate@${MIGRATE}"; fi

      - name: SBOM (web)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ids.outputs.registry }}/sold/web@${{ steps.web.outputs.digest }}
          format: spdx-json
          output-file: sbom-web.spdx.json
          upload-artifact: false
      - name: SBOM (worker)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ids.outputs.registry }}/sold/worker@${{ steps.worker.outputs.digest }}
          format: spdx-json
          output-file: sbom-worker.spdx.json
          upload-artifact: false
      - name: Attach the SBOMs to the images as signed attestations
        env:
          REGISTRY: ${{ steps.ids.outputs.registry }}
          WEB: ${{ steps.web.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate sbom-web.spdx.json "${REGISTRY}/sold/web@${WEB}"
          cosign attest --yes --type spdxjson --predicate sbom-worker.spdx.json "${REGISTRY}/sold/worker@${WORKER}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.ids.outputs.version }}
          path: sbom-*.spdx.json
          retention-days: 90

  stamp:
    name: Stamp the build into dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits environments/dev/release.json to main (no workflow is triggered by this push)
    env:
      WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
      WORKER_DIGEST: ${{ needs.build.outputs.worker_digest }}
      MIGRATE_DIGEST: ${{ needs.build.outputs.migrate_digest }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp and commit
        run: |
          set -euo pipefail
          args=(release:stamp --image-digest "${WEB_DIGEST}" --worker-image-digest "${WORKER_DIGEST}" --build "${BUILD_NUMBER}")
          if [ -n "${MIGRATE_DIGEST}" ]; then args+=(--migrate-image-digest "${MIGRATE_DIGEST}"); fi
          pnpm --silent sold "${args[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add environments/dev/release.json
          git commit -m "chore(release): stamp ${VERSION} into dev"
          # If branch protection rejects this push, allow the Actions bot to bypass it for this one file path,
          # or stamp through a PR (see docs/runbooks/environments.md).
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy-dev:
    name: Deploy dev
    needs: [build, stamp]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }} # includes the stamp commit
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Verify the signatures of the images about to be deployed
        run: |
          az acr login --name "$ACR_NAME"
          ops/terraform/scripts/verify-release-signatures.sh dev
      - name: Deploy (migrate, then roll out)
        run: pnpm --silent sold release:deploy dev

  promote:
    name: Open promotion PR
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TARGET: ${{ inputs.promote_to }}
      GH_TOKEN: ${{ secrets.PROMOTION_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Copy release.json and open the PR
        run: |
          set -euo pipefail
          case "${TARGET}" in
            stage) source_env=dev ;;
            prod) source_env=stage ;;
            *) echo "unsupported target ${TARGET}"; exit 1 ;;
          esac
          pnpm --silent sold promote "${source_env}" "${TARGET}" | tee promote.log
          if git diff --quiet -- "environments/${TARGET}/release.json"; then
            echo "${TARGET} already runs the ${source_env} release: nothing to promote"; exit 0
          fi
          version="$(pnpm --silent sold release:version "${source_env}" | tail -n1)"
          branch="promote/${TARGET}-${version//[^A-Za-z0-9]/-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add "environments/${TARGET}/release.json"
          git commit -m "chore(release): promote ${version} to ${TARGET}"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore(release): promote ${version} to ${TARGET}" \
            --body "Promotes **${version}** from \`${source_env}\` to \`${TARGET}\` by copying \`environments/${source_env}/release.json\`. The image digest is unchanged: nothing is rebuilt. Merging deploys it (${TARGET} uses a canary with SLO checks and auto-rollback; prod also needs environment approval and passes the deploy freeze check)."

  deploy-stage:
    name: Deploy stage
    needs: detect
    if: needs.detect.outputs.stage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      ACR_NAME: ${{ vars.ACR_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Verify the signatures of the images about to be deployed
        run: |
          az acr login --name "$ACR_NAME"
          ops/terraform/scripts/verify-release-signatures.sh stage
      - name: Deploy (migrate, canary 10/50/100 with SLO checks, auto-rollback)
        run: pnpm --silent sold release:deploy stage

  deploy-prod:
    name: Deploy prod (approval + freeze gate + canary)
    needs: [detect, deploy-stage]
    # Runs when the promotion PR changed environments/prod/release.json; if stage was deployed in the same push it must have succeeded.
    if: >-
      !cancelled() && needs.detect.outputs.prod == 'true' &&
      (needs.deploy-stage.result == 'success' || needs.deploy-stage.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Required reviewers and the `main`-only deployment branch rule live on this GitHub environment.
    environment: prod
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      # PRODUCTION identity: its federated credential only matches jobs bound to the `prod` environment.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PROD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      SOLD_DEPLOY_FREEZE: ${{ vars.SOLD_DEPLOY_FREEZE }}
      FREEZE_OVERRIDE: ${{ vars.PROD_FREEZE_OVERRIDE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Deploy freeze check (before any cloud access)
        run: |
          set -euo pipefail
          args=(release:freeze-check)
          if [ -n "${FREEZE_OVERRIDE}" ]; then args+=(--override "${FREEZE_OVERRIDE}"); fi
          pnpm --silent sold "${args[@]}"
      - name: Azure login (OIDC, PRODUCTION identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}
      - name: Verify the signatures of the images about to be deployed
        run: |
          az acr login --name "$ACR_NAME"
          ops/terraform/scripts/verify-release-signatures.sh prod
      - name: Deploy (migrate, canary 10/50/100 with SLO checks, auto-rollback)
        id: deploy
        env:
          # Read by the CLI: prod deploys only run from this approved job.
          SOLD_DEPLOY_APPROVED: prod
        run: |
          set -euo pipefail
          args=(release:deploy prod)
          if [ -n "${FREEZE_OVERRIDE}" ]; then args+=(--freeze-override "${FREEZE_OVERRIDE}"); fi
          pnpm --silent sold "${args[@]}"
      - name: Open an incident issue when the canary was rolled back or the deploy failed
        if: failure() && steps.deploy.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              ...context.repo,
              title: `Production deploy failed or was rolled back (${context.sha.slice(0, 7)})`,
              labels: ['prod', 'incident'],
              body: `The production canary failed its SLO check or the deploy errored. If it rolled back, traffic is back on the previous revision but environments/prod/release.json still names the new release: revert the promotion PR so git matches what is serving.\n\nRun: ${runUrl}`,
            });
