# Cost and hygiene automation for non-production environments (all through `pnpm sold`):
#   nightly      warn owners 24h before expiry, then destroy expired ephemeral environments (verified)
#   evenings     pause dev and stage (scale to zero, stop PostgreSQL); re-pausing also undoes Azure's
#                automatic restart of a stopped PostgreSQL server after 7 days
#   mornings     resume dev and stage
#   weekly       month-to-date cost report per environment
# Schedules are UTC and default to Australia/Sydney working hours (the demo customer bills in AUD);
# edit the cron lines per customer. Production is never selected: only ephemeral environments expire,
# and the CLI refuses to pause or destroy anything tagged or configured as prod.
# Opt an environment out of pausing with the repository variable ALWAYS_ON_ENVS (comma-separated env-ids).
name: Environment expiry and cost

on:
  schedule:
    - cron: '17 2 * * *' # nightly: warn + expire
    - cron: '0 9 * * 1-5' # pause dev/stage (19:00 AEST)
    - cron: '0 20 * * 0-4' # resume dev/stage (06:00 AEST, Mon-Fri)
    - cron: '30 22 * * 0' # weekly cost report (Monday 08:30 AEST)
  workflow_dispatch:
    inputs:
      action:
        description: What to run now
        required: true
        type: choice
        options: [warn, expire, pause, resume, cost]

permissions: {}

concurrency:
  group: env-expire
  cancel-in-progress: false

env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}

jobs:
  warn:
    name: Warn owners 24h before expiry
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'warn') ||
      github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ephemeral
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Find environments expiring within 24h
        id: expiring
        run: |
          set -euo pipefail
          json="$(pnpm --silent sold env:list --expiring-within 24h --json | jq -c '[.[] | select(.profile == "ephemeral")]')"
          echo "json=${json}" >> "$GITHUB_OUTPUT"
      - name: Open one issue per expiring environment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPIRING: ${{ steps.expiring.outputs.json }}
        with:
          script: |
            const envs = JSON.parse(process.env.EXPIRING);
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'env-expiry', per_page: 100 });
            for (const e of envs) {
              const title = `Preview ${e.envId} expires ${e.expiresAt}`;
              if (open.some((i) => i.title.startsWith(`Preview ${e.envId} expires`))) continue;
              // owner is a GitHub handle or an email; only handles can be mentioned
              const mention = /^[A-Za-z0-9-]+$/.test(e.owner) ? `@${e.owner} ` : '';
              await github.rest.issues.create({
                ...context.repo,
                title,
                labels: ['env-expiry'],
                body: `${mention}\`${e.envId}\` will be destroyed at ${e.expiresAt}. To keep it: \`pnpm sold env:extend ${e.envId} --ttl 24h\` (at most 7 days from now). Otherwise no action is needed.`,
              });
            }

  expire:
    name: Destroy expired ephemeral environments
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'expire') ||
      github.event.schedule == '17 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ephemeral
    permissions:
      contents: read
      id-token: write
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Destroy and verify each expired environment
        run: |
          set -euo pipefail
          mapfile -t ids < <(pnpm --silent sold env:list --expired --json | jq -r '.[] | select(.profile == "ephemeral") | .envId')
          echo "expired ephemeral environments: ${#ids[@]}"
          failed=0
          for id in "${ids[@]}"; do
            echo "::group::env:down ${id}"
            pnpm --silent sold env:down "${id}" --verify --require-cloudflare || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"

  pause:
    name: Pause ${{ matrix.env }} (off-hours)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'pause') ||
      github.event.schedule == '0 9 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stage]
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ matrix.env }}
      ALWAYS_ON_ENVS: ${{ vars.ALWAYS_ON_ENVS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Pause (idempotent; skips environments that do not exist or are opted out)
        run: |
          set -euo pipefail
          env_id="$(pnpm --silent sold env:id --env "${TARGET_ENV}" | tail -n1)"
          if [[ ",${ALWAYS_ON_ENVS// /}," == *",${env_id},"* ]]; then echo "${env_id} is always-on: skipping"; exit 0; fi
          if ! pnpm --silent sold env:list --json | jq -e --arg id "${env_id}" 'any(.[]; .envId == $id)' > /dev/null; then
            echo "${env_id} does not exist: nothing to pause"; exit 0
          fi
          pnpm --silent sold env:pause "${env_id}"

  resume:
    name: Resume ${{ matrix.env }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'resume') ||
      github.event.schedule == '0 20 * * 0-4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stage]
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENV: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Resume (skips environments that do not exist)
        run: |
          set -euo pipefail
          env_id="$(pnpm --silent sold env:id --env "${TARGET_ENV}" | tail -n1)"
          if ! pnpm --silent sold env:list --json | jq -e --arg id "${env_id}" 'any(.[]; .envId == $id)' > /dev/null; then
            echo "${env_id} does not exist: nothing to resume"; exit 0
          fi
          pnpm --silent sold env:resume "${env_id}"

  cost:
    name: Weekly cost report
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'cost') ||
      github.event.schedule == '30 22 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ephemeral
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Azure login (OIDC, non-production identity)
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_NONPROD }}
      - name: Month-to-date cost per environment
        run: |
          set -euo pipefail
          pnpm --silent sold env:cost --json > cost.json
          {
            echo '### Environment cost (month to date)'
            echo
            echo '| Environment | Cost | Currency |'
            echo '| --- | ---: | --- |'
            jq -r 'sort_by(-(.monthToDate // 0)) | .[] | "| \(.envId) | \(if .monthToDate == null then "unavailable" else (.monthToDate * 100 | round / 100 | tostring) end) | \(.currency // "-") |"' cost.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: environment-cost
          path: cost.json
          retention-days: 90
